# Refresh data weekly and deploy to GitHub Pages
# Runs every Monday at 6am UTC (midnight CST)
# Can also be triggered manually from GitHub Actions tab

name: Update Data & Deploy

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 6am UTC
  workflow_dispatch:  # Manual trigger button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect all data
        run: python -m src.scrapers.collect_all
        continue-on-error: true  # Don't fail deploy if one scraper has issues

      - name: Calculate neighbourhood scores
        run: python -m src.scoring.calculator
        continue-on-error: true

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp -r frontend/* deploy/
          mkdir -p deploy/data/processed
          cp data/processed/*.geojson deploy/data/processed/ 2>/dev/null || true
          cp data/processed/*.json deploy/data/processed/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
