<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regina SafeMap — Know Your Neighbourhood</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- App CSS -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- Header -->
    <header id="app-header">
        <div class="header-left">
            <h1>Regina SafeMap</h1>
            <span class="tagline">Know your neighbourhood before you move</span>
        </div>
        <div class="header-right">
            <input type="text" id="search-input" placeholder="Search neighbourhood..." autocomplete="off" />
            <a href="https://github.com/OpenPodHQ/openpod-regina-safemap" target="_blank" class="github-link" aria-label="View on GitHub">
                <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
            </a>
        </div>
    </header>

    <!-- Layer Toggle Bar -->
    <div id="layer-controls">
        <button class="layer-btn active" data-layer="crime" title="Crime Heatmap">
            <span class="layer-icon">🔥</span> Crime
        </button>
        <button class="layer-btn" data-layer="schools" title="Schools">
            <span class="layer-icon">🏫</span> Schools
        </button>
        <button class="layer-btn" data-layer="transit" title="Transit Stops">
            <span class="layer-icon">🚌</span> Transit
        </button>
        <button class="layer-btn" data-layer="amenities" title="Amenities">
            <span class="layer-icon">🏪</span> Amenities
        </button>
        <button class="layer-btn" data-layer="parks" title="Parks">
            <span class="layer-icon">🌳</span> Parks
        </button>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Neighbourhood Info Panel (slides in from right) -->
    <div id="info-panel" class="panel-hidden">
        <button id="panel-close" aria-label="Close panel">&times;</button>
        <div id="panel-content">
            <h2 id="panel-name">Select a neighbourhood</h2>
            <div id="panel-score" class="score-display">
                <div class="score-overall">
                    <span class="score-number">—</span>
                    <span class="score-grade">—</span>
                </div>
            </div>
            <div id="panel-breakdown">
                <div class="score-row"><span class="score-label">Safety</span><div class="score-bar"><div class="score-fill safety" style="width:0%"></div></div><span class="score-value">—</span></div>
                <div class="score-row"><span class="score-label">Schools</span><div class="score-bar"><div class="score-fill schools" style="width:0%"></div></div><span class="score-value">—</span></div>
                <div class="score-row"><span class="score-label">Transit</span><div class="score-bar"><div class="score-fill transit" style="width:0%"></div></div><span class="score-value">—</span></div>
                <div class="score-row"><span class="score-label">Amenities</span><div class="score-bar"><div class="score-fill amenities" style="width:0%"></div></div><span class="score-value">—</span></div>
                <div class="score-row"><span class="score-label">Walkability</span><div class="score-bar"><div class="score-fill walkability" style="width:0%"></div></div><span class="score-value">—</span></div>
            </div>
            <div id="panel-details">
                <h3>Quick Facts</h3>
                <ul id="panel-facts"></ul>
            </div>
            <div id="panel-trend">
                <h3>Crime Trend</h3>
                <p id="trend-text">—</p>
            </div>
        </div>
    </div>

    <!-- Legend -->
    <div id="legend">
        <h4>Crime Density</h4>
        <div class="legend-scale">
            <span class="legend-low">Low</span>
            <div class="legend-gradient"></div>
            <span class="legend-high">High</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="js/config.js"></script>
    <script src="js/map.js"></script>
    <script src="js/layers.js"></script>
    <script src="js/panels.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
