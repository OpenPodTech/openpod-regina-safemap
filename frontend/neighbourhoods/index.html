<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regina Neighbourhoods Guide — Safety Scores & Reviews | OpenPod SafeMap</title>
    <meta name="description" content="Explore all 68 Regina neighbourhoods with safety scores, crime data, and honest reviews. Find the safest, most affordable, or best neighbourhood for your needs.">
    <meta property="og:title" content="Regina Neighbourhoods Guide — Safety Scores & Reviews">
    <meta property="og:description" content="Explore all 68 Regina neighbourhoods with safety scores, crime data, and honest reviews. Free and open source.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://openpodtech.github.io/openpod-regina-safemap/neighbourhoods/">
    <meta property="og:image" content="https://openpodtech.github.io/openpod-regina-safemap/og-image.png">
    <link rel="canonical" href="https://openpodtech.github.io/openpod-regina-safemap/neighbourhoods/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #0EA5E9;
            --accent-glow: rgba(14, 165, 233, 0.4);
            --bg-deep: #0f0f23;
            --bg-mid: #0d1117;
            --bg-card: rgba(15, 23, 42, 0.75);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --text-primary: #f0f6fc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --green: #10b981;
            --teal: #14b8a6;
            --yellow: #f59e0b;
            --red: #ef4444;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-pill: 100px;
            --glass-blur: blur(16px);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #0d1117 50%, #0a1628 100%);
            color: var(--text-secondary);
            min-height: 100vh;
            font-size: 0.9rem;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Header */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border-subtle);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-mark {
            font-size: 1.3rem;
            color: var(--accent);
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .brand-badge {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--accent);
            background: rgba(14, 165, 233, 0.1);
            border: 1px solid rgba(14, 165, 233, 0.2);
            padding: 3px 8px;
            border-radius: var(--radius-pill);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-nav a {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
            transition: color 0.2s;
        }

        .header-nav a:hover { color: var(--text-primary); text-decoration: none; }
        .header-nav a.active { color: var(--accent); }

        .github-link {
            color: var(--text-muted);
            display: flex;
            align-items: center;
            padding: 4px;
            border-radius: 6px;
            transition: color 0.2s;
        }
        .github-link:hover { color: var(--text-primary); }

        /* Page Content */
        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        /* Sort Controls */
        .sort-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .sort-bar span {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .sort-btn {
            padding: 6px 14px;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-pill);
            background: transparent;
            color: var(--text-muted);
            font-size: 0.76rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sort-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .sort-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        /* Grid */
        .neighbourhood-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        @media (max-width: 900px) {
            .neighbourhood-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 560px) {
            .neighbourhood-grid { grid-template-columns: 1fr; }
            .page-title { font-size: 1.5rem; }
        }

        /* Cards */
        .neighbourhood-card {
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            gap: 16px;
            align-items: flex-start;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .neighbourhood-card:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 32px rgba(14, 165, 233, 0.1);
            border-color: var(--border-hover);
            text-decoration: none;
        }

        .card-score {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 800;
            flex-shrink: 0;
            border: 2px solid;
        }

        .score-green { color: var(--green); border-color: var(--green); background: rgba(16, 185, 129, 0.08); }
        .score-teal { color: var(--teal); border-color: var(--teal); background: rgba(20, 184, 166, 0.08); }
        .score-yellow { color: var(--yellow); border-color: var(--yellow); background: rgba(245, 158, 11, 0.08); }
        .score-red { color: var(--red); border-color: var(--red); background: rgba(239, 68, 68, 0.08); }

        .card-info {
            flex: 1;
            min-width: 0;
        }

        .card-name {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .card-badge {
            font-size: 0.68rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
        }

        .badge-safe { color: var(--green); border-color: rgba(16, 185, 129, 0.3); }
        .badge-caution { color: var(--yellow); border-color: rgba(245, 158, 11, 0.3); }
        .badge-danger { color: var(--red); border-color: rgba(239, 68, 68, 0.3); }

        /* Footer */
        .site-footer {
            text-align: center;
            padding: 32px 24px;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-subtle);
        }

        .site-footer a { color: var(--text-muted); }
        .site-footer a:hover { color: var(--accent); }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-brand">
            <a href="../" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:10px;">
                <span class="brand-mark">&#9672; OpenPod</span>
                <span class="brand-badge">SafeMap</span>
            </a>
        </div>
        <nav class="header-nav">
            <a href="../">Map</a>
            <a href="./" class="active">Neighbourhoods</a>
            <a href="../best-for/">Best For</a>
            <a href="https://github.com/OpenPodTech/openpod-regina-safemap" target="_blank" class="github-link" aria-label="GitHub">
                <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
            </a>
        </nav>
    </header>

    <main class="page-container">
        <h1 class="page-title">Regina Neighbourhoods</h1>
        <p class="page-subtitle">Safety scores, crime data, and honest reviews for every neighbourhood in Regina, Saskatchewan.</p>

        <div class="sort-bar">
            <span>Sort by:</span>
            <button class="sort-btn active" data-sort="score">Score</button>
            <button class="sort-btn" data-sort="safety">Safety</button>
            <button class="sort-btn" data-sort="name">Name</button>
        </div>

        <div class="neighbourhood-grid" id="grid"></div>
    </main>

    <footer class="site-footer">
        Open source civic intelligence &middot; Built by <a href="https://github.com/OpenPodTech">OpenPodTech</a> &middot; Free forever
    </footer>

    <script>
    (async function() {
        const scoresResp = await fetch('../data/processed/scores.json');
        const scoresData = await scoresResp.json();
        const scores = scoresData.scores;

        const descResp = await fetch('../data/processed/descriptions.json');
        const descriptions = await descResp.json();

        const grid = document.getElementById('grid');

        function getScoreClass(score) {
            if (score >= 90) return 'score-green';
            if (score >= 70) return 'score-teal';
            if (score >= 50) return 'score-yellow';
            return 'score-red';
        }

        function getSafetyBadge(safety) {
            if (safety >= 90) return '<span class="card-badge badge-safe">Very Safe</span>';
            if (safety >= 70) return '<span class="card-badge badge-safe">Safe</span>';
            if (safety >= 50) return '<span class="card-badge badge-caution">Moderate</span>';
            return '<span class="card-badge badge-danger">High Crime</span>';
        }

        function getDescription(name) {
            const desc = descriptions[name];
            if (desc) return desc.description;
            return 'Residential neighbourhood in Regina.';
        }

        function renderCards(sortedScores) {
            grid.innerHTML = '';
            sortedScores.forEach(n => {
                const card = document.createElement('a');
                card.className = 'neighbourhood-card';
                card.href = 'neighbourhood.html?name=' + encodeURIComponent(n.name);
                card.innerHTML = `
                    <div class="card-score ${getScoreClass(n.overall)}">${n.overall}</div>
                    <div class="card-info">
                        <div class="card-name">${n.name}</div>
                        <div class="card-desc">${getDescription(n.name)}</div>
                        <div class="card-meta">
                            ${getSafetyBadge(n.safety)}
                            <span class="card-badge">Grade ${n.grade}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function sortScores(key) {
            let sorted;
            if (key === 'name') {
                sorted = [...scores].sort((a, b) => a.name.localeCompare(b.name));
            } else if (key === 'safety') {
                sorted = [...scores].sort((a, b) => b.safety - a.safety);
            } else {
                sorted = [...scores].sort((a, b) => b.overall - a.overall);
            }
            return sorted;
        }

        // Initial render
        renderCards(sortScores('score'));

        // Sort buttons
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderCards(sortScores(btn.dataset.sort));
            });
        });
    })();
    </script>
</body>
</html>
